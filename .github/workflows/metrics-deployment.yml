name: Refresh profile

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Update profile data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Profile is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: 更新个人主页动态数据"
          git push
